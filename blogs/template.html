<!--
  Copy this file to: blogs/YYYY-MM-DD-slug.html
  For manual posts: replace {{TITLE}}, {{DATE}}, {{EXCERPT}}, {{TAGS}}, {{ISSUE}}, {{URL}}, {{CONTENT}}.
  For issue-based posts: the issue-to-post script fills these automatically.
  Create a GitHub issue with label "blog" to auto-publish.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{TITLE}} — Amarbir Singh</title>
  <link rel="canonical" href="{{URL}}" />
  <meta name="description" content="{{EXCERPT}}" />
  <meta name="date" content="{{DATE}}" />
  <meta name="excerpt" content="{{EXCERPT}}" />
  <meta name="tags" content="{{TAGS}}" />
  <meta name="github-issue" content="{{ISSUE}}" />
  <meta property="og:title" content="{{TITLE}} — Amarbir Singh" />
  <meta property="og:description" content="{{EXCERPT}}" />
  <meta property="og:url" content="{{URL}}" />
  <meta property="og:type" content="article" />
  <meta property="og:image" content="https://singhamarbir.com/og-image.png" />
  <meta property="og:locale" content="en_CA" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}} — Amarbir Singh" />
  <meta name="twitter:description" content="{{EXCERPT}}" />
  <meta name="twitter:image" content="https://singhamarbir.com/og-image.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{TITLE}}",
    "description": "{{EXCERPT}}",
    "datePublished": "{{DATE}}",
    "author": {
      "@type": "Person",
      "name": "Amarbir Singh",
      "url": "https://singhamarbir.com"
    },
    "publisher": {
      "@type": "Person",
      "name": "Amarbir Singh"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{URL}}"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"></noscript>
  <style>
    :root{ --bg: #ffffff; --text: #0f172a; --muted: #374151; }
    [data-theme="dark"]{ --bg:#0b1220; --text:#f8fafc; --muted:#9ca3af; }
    html{ background:var(--bg); color:var(--text); scroll-behavior: smooth; }
    body{ font-family: 'Inter', Arial, sans-serif; margin:0; padding:20px; min-height:100vh; }
    .back-link{ color:var(--muted); text-decoration:none; font-size:14px; }
    .back-link:hover{ color:var(--text); }
    article{ max-width:720px; margin:0 auto; line-height:1.7; }
    h1{ font-size:2rem; font-weight:800; margin-bottom:1rem; }
    h2{ font-size:1.25rem; font-weight:600; margin-top:2rem; margin-bottom:0.75rem; }
    p, li{ color:var(--muted); }
    ul{ list-style:disc; padding-left:1.5rem; margin:1rem 0; }
    ol{ list-style:decimal; padding-left:1.5rem; margin:1rem 0; }
    code{ background:rgba(128,128,128,0.15); padding:2px 6px; border-radius:4px; font-size:0.9em; }
    pre{ background:rgba(128,128,128,0.08); padding:1rem; border-radius:6px; overflow-x:auto; }
    pre code{ background:none; padding:0; }
    table{ width:100%; border-collapse:collapse; margin:1rem 0; font-size:0.9rem; }
    th, td{ border:1px solid rgba(128,128,128,0.3); padding:8px 12px; text-align:left; }
    th{ font-weight:600; background:rgba(128,128,128,0.08); }
    img{ max-width:100%; height:auto; border-radius:8px; display:block; margin:1.5rem auto; }
    a{ color:#2563eb; text-decoration:none; }
    a:hover{ text-decoration:underline; }
    footer{ margin-top:4rem; padding-top:2rem; border-top:1px solid rgba(128,128,128,0.2); font-size:13px; color:var(--muted); }
  </style>
</head>
<body>

  <article>
    <nav class="mb-8">
      <a href="/blogs/" class="back-link">&larr; Back to Writing</a>
    </nav>
    
    <h1>{{TITLE}}</h1>

    {{CONTENT}}

    <footer>
      <p>Written by Amarbir Singh &middot; <a href="/">Home</a></p>
    </footer>
  </article>

  <script>
    var t = localStorage.getItem('site-theme') || 'system';
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  </script>
  <script src="/scripts/blog-engagement-v2.js" defer></script>
</body>
</html>
